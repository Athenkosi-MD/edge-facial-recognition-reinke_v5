<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Edge Telematics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent:      #1565c0;
            --accent-mid:  #1976d2;
            --accent-light:#2196f3;
            --sidebar-bg:  #0a1628;
            --red:         #e53935;
            --red-pale:    #fdecea;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a1628;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated background grid ── */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(33,150,243,.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(33,150,243,.06) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }
        @keyframes gridMove {
            0%   { transform: translateY(0); }
            100% { transform: translateY(48px); }
        }

        /* ── Glow orbs ── */
        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); pointer-events: none; opacity: .18;
        }
        .orb-1 { width:500px; height:500px; background:#1565c0; top:-120px; left:-100px; }
        .orb-2 { width:400px; height:400px; background:#0d47a1; bottom:-80px; right:-60px; }

        /* ── Main card ── */
        .card {
            position: relative; z-index: 10;
            width: 420px; max-width: 96vw;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 20px;
            backdrop-filter: blur(24px);
            padding: 44px 40px 40px;
            box-shadow: 0 24px 80px rgba(0,0,0,.5);
        }

        /* ── Logo ── */
        .logo-wrap {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-wrap img {
            width: 220px;
            max-width: 80%;
            border-radius: 8px;
        }

        /* ── Face-scan animation ── */
        .face-scanner {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 18px 0 28px;
            gap: 10px;
        }
        .scanner-frame {
            position: relative;
            width: 80px; height: 80px;
        }
        /* Corner brackets */
        .scanner-frame::before,
        .scanner-frame::after,
        .corner-br, .corner-bl {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            border-color: #2196f3;
            border-style: solid;
        }
        .scanner-frame::before { top:0; left:0; border-width:3px 0 0 3px; border-radius:3px 0 0 0; }
        .scanner-frame::after  { top:0; right:0; border-width:3px 3px 0 0; border-radius:0 3px 0 0; }
        .corner-br { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 3px 0; }
        .corner-bl { bottom:0; left:0;  border-width:0 0 3px 3px; border-radius:0 0 0 3px; }

        /* Face SVG inside frame */
        .face-icon {
            position: absolute; inset: 14px;
            stroke: rgba(33,150,243,.55);
            fill: none;
        }

        /* Scan line */
        .scan-line {
            position: absolute; left: 6px; right: 6px; height: 2px;
            background: linear-gradient(90deg, transparent, #2196f3, transparent);
            border-radius: 2px;
            animation: scan 2.4s ease-in-out infinite;
            box-shadow: 0 0 8px #2196f3;
        }
        @keyframes scan {
            0%   { top: 10px; opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { top: 68px; opacity: 0; }
        }

        /* Dots */
        .scan-dots {
            display: flex; gap: 5px; align-items: center;
        }
        .scan-dots span {
            width: 5px; height: 5px; border-radius: 50%;
            background: #2196f3; opacity: .3;
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .scan-dots span:nth-child(2) { animation-delay: .2s; }
        .scan-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes dotPulse {
            0%,100% { opacity:.2; transform:scale(.8); }
            50%      { opacity:1;  transform:scale(1.2); }
        }

        .scanner-label {
            font-size: .7rem;
            font-family: 'JetBrains Mono', monospace;
            color: #2196f3;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: .8;
        }

        /* ── Form ── */
        .form-title {
            font-size: 1.25rem; font-weight: 700;
            color: #fff; text-align: center;
            margin-bottom: 4px;
        }
        .form-sub {
            font-size: .8rem; color: rgba(255,255,255,.45);
            text-align: center; margin-bottom: 28px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: .72rem; font-weight: 600;
            color: rgba(255,255,255,.5);
            text-transform: uppercase; letter-spacing: .07em;
            margin-bottom: 7px;
        }
        .input-wrap { position: relative; }
        .input-wrap svg {
            position: absolute; left: 13px; top: 50%;
            transform: translateY(-50%);
            stroke: rgba(255,255,255,.3);
            pointer-events: none;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: rgba(255,255,255,.07);
            border: 1.5px solid rgba(255,255,255,.12);
            border-radius: 10px;
            font-size: .9rem; font-family: inherit;
            color: #fff; outline: none;
            transition: border-color .2s, background .2s;
        }
        input::placeholder { color: rgba(255,255,255,.25); }
        input:focus {
            border-color: #2196f3;
            background: rgba(33,150,243,.08);
        }
        input:focus + svg,
        .input-wrap:focus-within svg { stroke: #2196f3; }

        .btn-login {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #1565c0, #1976d2);
            color: #fff; border: none; border-radius: 10px;
            font-size: .95rem; font-weight: 700;
            font-family: inherit; cursor: pointer; margin-top: 6px;
            letter-spacing: .02em;
            box-shadow: 0 4px 20px rgba(21,101,192,.5);
            transition: transform .15s, box-shadow .15s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(21,101,192,.65);
        }
        .btn-login:active { transform: translateY(0); }

        /* Error */
        .error-box {
            background: rgba(229,57,53,.15);
            border: 1px solid rgba(229,57,53,.35);
            border-radius: 9px; color: #ef9a9a;
            font-size: .84rem; padding: 11px 14px;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 9px;
        }

        /* Footer note */
        .footer-note {
            text-align: center; margin-top: 22px;
            font-size: .72rem; color: rgba(255,255,255,.25);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: .04em;
        }
    </style>
</head>

    <!-- Face scanner animation -->
    <div class="face-scanner">
        <div class="scanner-frame">
            <!-- Face outline SVG -->
            <svg class="face-icon" viewBox="0 0 52 52" stroke-width="1.4">
                <ellipse cx="26" cy="20" rx="11" ry="13"/>
                <path d="M6 46c0-9.4 9-17 20-17s20 7.6 20 17"/>
                <!-- eyes -->
                <circle cx="21" cy="18" r="1.6" fill="rgba(33,150,243,.55)" stroke="none"/>
                <circle cx="31" cy="18" r="1.6" fill="rgba(33,150,243,.55)" stroke="none"/>
                <!-- smile -->
                <path d="M21 24 q5 4 10 0" stroke-linecap="round"/>
            </svg>
            <div class="corner-br"></div>
            <div class="corner-bl"></div>
            <div class="scan-line"></div>
        </div>
        <div class="scan-dots">
            <span></span><span></span><span></span>
        </div>
        <div class="scanner-label">Driver Enrollment System</div>
    </div>

    <div class="form-title">Authorised Access Only</div>
    <div class="form-sub">Sign in</div>

    {% if error %}
    <div class="error-box">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="flex-shrink:0">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label>Username</label>
            <div class="input-wrap">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.8">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <input type="text" name="username" placeholder="Enter username"
                       required autocomplete="username"
                       value="{{ request.form.get('username','') }}">
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.8">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
                <input type="password" name="password" placeholder="••••••••"
                       required autocomplete="current-password">
            </div>
        </div>
        <button class="btn-login" type="submit">Sign In</button>
    </form>

    <div class="footer-note">ANALYSE. CUSTOMISE. OPTIMISE.</div>
</div>
</body>
</html>
